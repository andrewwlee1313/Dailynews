<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew's Daily Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f0f0f;
    --paper: #f5f0e8;
    --accent: #c8402a;
    --gold: #c9a84c;
    --muted: #7a7060;
    --card: #fffdf7;
    --border: #ddd8cc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  .masthead { background: var(--ink); color: var(--paper); border-bottom: 3px solid var(--accent); }
  .masthead-inner { max-width: 1100px; margin: 0 auto; padding: 28px 32px 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .masthead h1 { font-family: 'Playfair Display', serif; font-size: clamp(30px, 5vw, 52px); font-weight: 900; letter-spacing: -1px; line-height: 1; }
  .masthead h1 span { color: var(--accent); }
  .masthead-meta { text-align: right; font-size: 12px; color: #aaa; letter-spacing: 1px; text-transform: uppercase; line-height: 1.8; }
  .dateline { font-family: 'Playfair Display', serif; font-size: 13px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; padding: 8px 32px; max-width: 1100px; margin: 0 auto; border-top: 1px solid #333; }
  .toolbar { background: var(--ink); padding: 10px 32px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { background: var(--accent); color: white; border: none; padding: 9px 22px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 2px; transition: background 0.2s; display: flex; align-items: center; gap: 6px; }
  .btn:hover { background: #a8301a; }
  .btn.secondary { background: #2a2a2a; border: 1px solid #444; }
  .btn.secondary:hover { background: #3a3a3a; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .container { max-width: 1100px; margin: 0 auto; padding: 32px; }
  #loading { display: none; text-align: center; padding: 80px 32px; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--muted); font-style: italic; }
  .loading-progress { margin-top: 12px; font-size: 12px; color: var(--muted); letter-spacing: 1px; min-height: 20px; }
  #welcome { text-align: center; padding: 80px 32px; }
  #welcome h2 { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 700; margin-bottom: 12px; }
  #welcome p { color: var(--muted); font-size: 16px; margin-bottom: 28px; line-height: 1.6; }
  .big-btn { background: var(--accent); color: white; border: none; padding: 16px 40px; font-family: 'Playfair Display', serif; font-size: 18px; cursor: pointer; border-radius: 2px; }
  .big-btn:hover { background: #a8301a; }
  #news-content { display: none; }
  .breaking-banner { background: var(--accent); color: white; padding: 10px 18px; font-size: 12px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 28px; display: flex; align-items: center; gap: 10px; }
  .breaking-dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .section-header { display: flex; align-items: center; gap: 12px; margin: 36px 0 16px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  .section-header h2 { font-family: 'Playfair Display', serif; font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
  .section-icon { font-size: 16px; }
  .section-line { flex: 1; height: 1px; background: var(--border); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 2px; transition: box-shadow 0.2s, transform 0.2s; position: relative; }
  .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
  .card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); }
  .card.featured::before { background: var(--gold); }
  .card.featured { border-color: #e8dfc0; }
  .card-tag { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .card.featured .card-tag { color: var(--gold); }
  .card h3 { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; line-height: 1.3; margin-bottom: 10px; }
  .card p { font-size: 13.5px; line-height: 1.65; color: #444; }
  .card-simple { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 12.5px; color: var(--muted); font-style: italic; line-height: 1.5; display: none; }
  .card-simple strong { color: var(--accent); font-style: normal; }
  .impact-box { background: var(--ink); color: var(--paper); padding: 28px 32px; margin: 36px 0 0; border-radius: 2px; }
  .impact-box h2 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 6px; color: var(--gold); }
  .impact-subtitle { font-size: 12px; color: #888; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px; }
  .impact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .impact-item { background: #1e1e1e; border: 1px solid #333; border-left: 3px solid var(--gold); padding: 16px; border-radius: 2px; }
  .impact-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .impact-item p { font-size: 13px; line-height: 1.6; color: #ccc; }
  .ticker-wrap { background: #1a1a1a; overflow: hidden; padding: 8px 0; margin-top: 32px; }
  .ticker-inner { display: inline-flex; gap: 48px; white-space: nowrap; animation: ticker 40s linear infinite; font-size: 12px; color: #aaa; }
  .ticker-inner span { color: var(--gold); }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .footer { text-align: center; padding: 28px; color: var(--muted); font-size: 12px; letter-spacing: 1px; border-top: 1px solid var(--border); margin-top: 40px; }
  .error-box { background: #fff5f5; border: 1px solid #fcc; border-left: 3px solid var(--accent); padding: 20px; border-radius: 2px; color: #900; font-size: 14px; line-height: 1.6; }
  @media (max-width: 600px) {
    .masthead-inner { flex-direction: column; align-items: flex-start; }
    .masthead-meta { text-align: left; }
    .container { padding: 20px 16px; }
    .toolbar { padding: 10px 16px; }
  }
</style>
</head>
<body>
<div class="masthead">
  <div class="masthead-inner">
    <h1>Andrew's<br><span>Daily Brief</span></h1>
    <div class="masthead-meta">
      <div id="current-date">—</div>
      <div>Sydney, Australia</div>
      <div>Personalised Edition</div>
    </div>
  </div>
  <div class="dateline" id="dateline">Your world. Your news. Every day.</div>
</div>
<div class="toolbar">
  <button class="btn" id="fetch-btn" onclick="fetchNews()">📰 Fetch Today's News</button>
  <button class="btn secondary" id="simple-btn" onclick="toggleSimple()">💡 Simple Mode</button>
</div>
<div class="container">
  <div id="welcome">
    <h2>Good morning, Andrew ☀️</h2>
    <p>Your personalised briefing — Breaking News, Finance, Football,<br>Fitness, Tech & Sales. Tailored for Sydney.</p>
    <button class="big-btn" onclick="fetchNews()">Load Today's Brief →</button>
  </div>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-msg">Scanning the wires...</div>
    <div class="loading-progress" id="loading-progress"></div>
  </div>
  <div id="news-content"></div>
</div>
<script>
const WORKER_URL = 'https://nameless-sky-e235.andreww-lee1313.workers.dev';

let simpleMode = false;

const SECTIONS = [
  { id: 'breaking', title: 'Breaking News',     icon: '🌍' },
  { id: 'finance',  title: 'Finance & Markets', icon: '📈' },
  { id: 'football', title: 'Football',          icon: '⚽' },
  { id: 'fitness',  title: 'Fitness & Health',  icon: '💪' },
  { id: 'tech',     title: 'Tech & AI',         icon: '🤖' },
  { id: 'sales',    title: 'Sales & Business',  icon: '💼' },
];

function setDate() {
  const now = new Date();
  document.getElementById('current-date').textContent =
    now.toLocaleDateString('en-AU', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  document.getElementById('dateline').textContent =
    `Vol. ${now.getFullYear()} · Issue ${Math.ceil((now - new Date(now.getFullYear(),0,1))/864e5)} · Sydney Edition`;
}

function toggleSimple() {
  simpleMode = !simpleMode;
  document.querySelectorAll('.card-simple').forEach(el => el.style.display = simpleMode ? 'block' : 'none');
  document.getElementById('simple-btn').textContent = simpleMode ? '💡 Hide Simple Mode' : '💡 Simple Mode';
}

async function callClaude(userPrompt) {
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: 'You are a news curator. Always respond with only valid, complete JSON. No markdown, no backticks, no explanation. Only JSON.',
      messages: [{ role: 'user', content: userPrompt }]
    })
  });
  const data = await res.json();
  if (!data.content) throw new Error(data.error?.message || 'API error');
  const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('').trim();
  const clean = text.replace(/^```(?:json)?|```$/gm, '').trim();
  const match = clean.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
  if (!match) throw new Error('No JSON in response');
  return JSON.parse(match[0]);
}

const SECTION_PROMPTS = {
  breaking: (d) => `Today is ${d}. Give me exactly 2 breaking world or Australian news stories.
Return a JSON array with exactly this shape, nothing else:
[{"tag":"WORLD","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one plain sentence for a Sydney resident."},{"tag":"AUSTRALIA","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one plain sentence."}]`,
  finance: (d) => `Today is ${d}. Give me exactly 2 finance or markets news items relevant to someone in Sydney Australia.
Return a JSON array with exactly this shape, nothing else:
[{"tag":"MARKETS","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one plain sentence about personal financial impact."},{"tag":"PROPERTY","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one plain sentence."}]`,
  football: (d) => `Today is ${d}. Give me exactly 2 football soccer news items (World Cup 2026, Premier League, or A-League).
Return a JSON array with exactly this shape, nothing else:
[{"tag":"WORLD CUP","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one fun sentence for a soccer player."},{"tag":"FOOTBALL","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one fun sentence."}]`,
  fitness: (d) => `Today is ${d}. Give me exactly 2 fitness or health news items or practical tips.
Return a JSON array with exactly this shape, nothing else:
[{"tag":"FITNESS","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one actionable sentence."},{"tag":"HEALTH","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one actionable sentence."}]`,
  tech: (d) => `Today is ${d}. Give me exactly 2 tech or AI news items.
Return a JSON array with exactly this shape, nothing else:
[{"tag":"AI","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one plain sentence."},{"tag":"TECH","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one plain sentence."}]`,
  sales: (d) => `Today is ${d}. Give me exactly 2 sales or business development insights or news items.
Return a JSON array with exactly this shape, nothing else:
[{"tag":"SALES","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one actionable sentence for a sales manager."},{"tag":"BUSINESS","headline":"headline here","summary":"One or two sentence summary.","simple":"What this means for you: one actionable sentence."}]`,
};

async function fetchNews() {
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('news-content').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('fetch-btn').disabled = true;
  const today = new Date().toLocaleDateString('en-AU', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  const progress = document.getElementById('loading-progress');
  const loadingMsg = document.getElementById('loading-msg');
  const results = {};
  for (let i = 0; i < SECTIONS.length; i++) {
    const s = SECTIONS[i];
    loadingMsg.textContent = `Loading ${s.icon} ${s.title}...`;
    progress.textContent = `Section ${i + 1} of ${SECTIONS.length}`;
    try { results[s.id] = await callClaude(SECTION_PROMPTS[s.id](today)); }
    catch(e) { results[s.id] = [{ tag: s.title.toUpperCase(), headline: 'Could not load — try refreshing', summary: e.message, simple: '' }]; }
  }
  loadingMsg.textContent = 'Building your personal summary...';
  progress.textContent = '';
  let impact = [];
  try {
    impact = await callClaude(`Today is ${today}. Write a personal impact summary for Andrew, a sales manager in Sydney Australia.
Return a JSON array with exactly this shape, nothing else:
[{"label":"Your Wallet 💰","text":"One or two sentences about financial news impact on his money or investments or property."},{"label":"Your Game ⚽","text":"One or two sentences about football news he should know."},{"label":"Your Career 💼","text":"One or two sentences about what sales or business news means for his work."},{"label":"Your Body 💪","text":"One practical fitness tip he can use today."}]`);
  } catch(e) {}
  loadingMsg.textContent = 'Almost done...';
  let ticker = [];
  try {
    ticker = await callClaude(`Today is ${today}. Give me 8 short news ticker headlines, max 7 words each.
Return a JSON array of strings only, nothing else:
["headline one","headline two","headline three","headline four","headline five","headline six","headline seven","headline eight"]`);
  } catch(e) {}
  document.getElementById('loading').style.display = 'none';
  renderNews({ sections: SECTIONS.map(s => ({ ...s, stories: results[s.id] || [] })), impact, ticker, today });
}

function renderNews({ sections, impact, ticker, today }) {
  const time = new Date().toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit' });
  let html = `<div class="breaking-banner"><div class="breaking-dot"></div> LIVE BRIEF — ${time} &nbsp;·&nbsp; ${today}</div>`;
  for (const section of sections) {
    if (!section.stories || !section.stories.length) continue;
    html += `<div class="section-header"><span class="section-icon">${section.icon}</span><h2>${section.title}</h2><div class="section-line"></div></div><div class="grid">`;
    section.stories.forEach((story, i) => {
      html += `<div class="card ${i===0?'featured':''}">
        <div class="card-tag">${story.tag || section.title}</div>
        <h3>${story.headline}</h3>
        <p>${story.summary}</p>
        ${story.simple ? `<div class="card-simple" style="display:${simpleMode?'block':'none'}"><strong>Simple:</strong> ${story.simple}</div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }
  if (impact && impact.length) {
    html += `<div class="impact-box"><h2>What Does This Mean For You?</h2><div class="impact-subtitle">No jargon — just what matters to you today</div><div class="impact-grid">`;
    impact.forEach(item => { html += `<div class="impact-item"><div class="impact-label">${item.label}</div><p>${item.text}</p></div>`; });
    html += `</div></div>`;
  }
  if (ticker && ticker.length) {
    const all = [...ticker, ...ticker, ...ticker].map(t => `<span>▪</span> ${t}`).join('&nbsp;&nbsp;&nbsp;');
    html += `<div class="ticker-wrap"><div class="ticker-inner">${all}&nbsp;&nbsp;&nbsp;${all}</div></div>`;
  }
  html += `<div class="footer">Andrew's Daily Brief &nbsp;·&nbsp; Powered by Claude AI &nbsp;·&nbsp; Sydney, Australia &nbsp;·&nbsp; Refresh anytime</div>`;
  document.getElementById('news-content').innerHTML = html;
  document.getElementById('news-content').style.display = 'block';
  document.getElementById('fetch-btn').disabled = false;
}

setDate();
</script>
</body>
</html>
